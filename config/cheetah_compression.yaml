%YAML 1.3
---
title: "Config to run Cheetah task"
experiment: "mfx100903824"
run: "27"
date: "2025/09/29"
lute_version: 0.2.0      # Do not be change unless need to force older version
task_timeout: 6000
work_dir: "/sdf/scratch/users/d/dorlhiac"
...
---
# We will define some convenience keys for substitution in other parameters
EXPERIMENT_DIR: "/sdf/data/lcls/ds/mfx/{{ experiment }}"
XTC2_FILE_PATH: "{{ EXPERIMENT_DIR }}/scratch/dorlhiac"
XTC2_FILE_NAME: "{{ experiment }}-r{{ run:04d }}-s000-c000.xtc2"
DET_CALIB_DIR: "calib/Epix10ka2M::CalibV1/MfxEndstation.0:Epix10ka2M.0"

RunCheetah:                       # All variables are given as strings
  executable: mpirun
  #bind_to: "core"                 # For compression may want to uncomment and set to `none`
  n_processes: 6                  # Number of processes to launch
  om_executable: "/sdf/scratch/users/d/dorlhiac/work/om_rel/bin/om_monitor"
  om_config: "/sdf/scratch/users/d/dorlhiac/work/cheetah_tests/cheetah_config.yaml"
  # NOTE: if passing files=... for SingleFileDataSource, do NOT quote the filename.
  # I.e. use source: "files=/path/to/file"
  #      NOT source: "files='/path/to/file'"
  # LUTE will not execute the executable with a shell, and we do not want the
  # extra quotes otherwise psana will not find the file correctly.
  source: "files={{ XTC2_FILE_PATH }}/{{ XTC2_FILE_NAME }}"
  lute_template_cfg:
    template_name: "cheetah_template.yaml"
    output_path: "/sdf/scratch/users/d/dorlhiac/work/cheetah_tests/cheetah_config.yaml"
  cheetah_subconfig:
    om:
      processing_layer: "CheetahProcessing"
      data_retrieval_layer: "Psana2DataEventHandler"
    data_retrieval_layer:
      data_sources:
        timestamp:
          type: "TimestampPsana2"
        event_id:
          type: "EventIdPsana2"
        detector_data:
          type: "AreaDetectorPsana2"
          psana_name: "epix10k2M"
          calibration: "true"
          psana_algorithm: "xtc1dump"
        detector_distance:
          type: "FloatValueFromConfiguration"
          psana_name: null
          value: 100.0
        beam_energy:
          type: "FloatValueFromConfiguration"
          value: 9000
    cheetah:
      processed_directory: "{{ EXPERIMENT_DIR }}/results"
      processed_filename_prefix: "{{ experiment }}-{{ run }}"
      class_sums_filename_prefix: "{{ run }}"
    crystallography:
      geometry_file: "{{ EXPERIMENT_DIR }}/scratch/dorlhiac/test.geom"
      responding_url: null
    peakfinder8_peak_detection:
      adc_threshold: 100.0
      minimum_snr: 5.0
      min_pixel_count: 1
      max_pixel_count: 30
      local_bg_radius: 4
      bad_pixel_map_filename: null
      min_res: 80
      max_res: 800
    compression:
      run_compression: True
      backend: "roibinsz"
      compression_parameters:
        compressor: "qoz"
        abs_error: 42
        bin_size: 2
        roi_window_size: 9

IndexCrystFEL:
  #in_file: ""            # Location of a `.lst` file listing CXI files
  #out_file: ""           # Where to write the output stream file
  geometry: "{{ EXPERIMENT_DIR }}/scratch/dorlhiac/test.geom" # Location of a geometry file
  indexing: "mosflm"      # Indexing methods
  int_radius: "4,5,7"     # Integration radii
  tolerance: "5,5,5,1.5"  # Tolerances
  multi: True
  profile: True
  no_revalidate: True

ConvertXtc1to2:               # All variables are given as strings
  mode: "idx"                 # Mode
  node_id: "1"                # Node ID for the detector
  geometry: "{{ EXPERIMENT_DIR }}/{{ DET_CALIB_DIR }}/geometry/12-end.data"
  eventfile: ""
  output_file: "{{ XTC2_FILE_PATH }}/{{ XTC2_FILE_NAME }}"
  xtc1_access_pattern:
    epix10k2M: # Name of the detector in the converted XTC2
    # You can have a list of attributes you will convert that will be stored in
    # this detector
      - xtc2_attr_name: "calib"        # Name of this attribute in xtc2
        object_name: "epix10k2M"       # Name of the detector in psana1
        object_type: "psana.Detector"  # Name of the object type in psana1
        object_field_name: "calib"     # Name of the per-event method to use in psana1
    EBeam:
      - xtc2_attr_name: "photon_energy"
        object_name: "EBeam"
        object_type: "psana.Detector"
        object_field_name: ["get","ebeamPhotonEnergy"]
