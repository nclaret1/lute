%YAML 1.3
---
# ========= HEADER (global) =========
title: "SFX: ZMQ-streaming Peakfinder8 (8 parallel senders) - r0016"
experiment: "mfxx49820"
run: "16"
run_pad: "0016"
lute_version: 0.1
task_timeout: 259200

work_dir: "/sdf/data/lcls/ds/mfx/mfxx49820/results/nclaret/lute_output/ZmqStream/baseline_peakfinder8_8senders/r0016/"
...
---
detector: "epix10k2M"
out_root: "{{ work_dir }}"
pv_camera_length: "MFX:ROB:CONT:POS:Z"
event_receiver: "evr0"
geom_file: "/sdf/data/lcls/ds/mfx/mfxx49820/results/nclaret/geom/r0016.geom"
n_senders: 8            # number of parallel psana1 senders; wall time ~1/n_senders
n_events_total: 37710   # total events in r0016; required when n_senders > 1


SfxDrFindPeaksZmq:
  outdir: "{{ out_root }}"
  det_name: "{{ detector }}"
  event_receiver: "{{ event_receiver }}"
  pv_camera_length: "{{ pv_camera_length }}"
  geometry_file: "{{ geom_file }}"
  algorithm: "Peakfinder8"
  n_events: "{{ n_events_total }}"
  n_senders: "{{ n_senders }}"
  eventfile: ""
  psana_mask: false
  min_peaks: 10
  max_peaks: 2048
  npix_min: 2
  npix_max: 30
  amax_thr: 40
  atot_thr: 180
  son_min: 10
  peak_rank: 3
  r0: 3.0
  dr: 2.0
  nsigm: 10.0
  tol: 1e-3
  max_iter: 500
  dr_component: null
  dr_method: null
  size: 7
  post_threshold_scale: 0


IndexCrystFEL:
  in_file: "{{ SfxDrFindPeaksZmq.outdir }}/{{ experiment }}_{{ run }}_.list"
  executable: "/sdf/group/lcls/ds/tools/crystfel/0.10.2/bin/indexamajig"
  out_file: "{{ out_root }}/stream_{{ run }}.stream"
  geometry: "{{ geom_file }}"
  no_revalidate: True
  multi: True
  indexing: "mosflm,xds"
  int_radius: '3,4,5'
  profile: True
  peaks: "cxi"
  tolerance: "5,5,5,1.5"
  cell_file: "/sdf/data/lcls/ds/mfx/mfxx49820/results/btx_pypca/cell/reference.cell"


...
