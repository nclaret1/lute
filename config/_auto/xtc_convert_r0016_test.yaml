%YAML 1.3
---
title: "XTC1 to XTC2 conversion - r0016 calibration check (5 events)"
experiment: "mfxx49820"
run: "16"
lute_version: 0.1
task_timeout: 3600
work_dir: "/sdf/data/lcls/ds/mfx/mfxx49820/results/nclaret/analysis/calib_compare/"
...
---
INSTRUMENT: "mfx"
EXPERIMENT_DIR: "/sdf/data/lcls/ds/{{ INSTRUMENT }}/{{ experiment }}"
RESULTS_DIR: "{{ EXPERIMENT_DIR }}/results/nclaret/analysis/calib_compare"
PSDM_SUBDIR: "{{ INSTRUMENT }}/{{ experiment }}/xtc"
XTC2_FILE_NAME: "{{ experiment }}-r{{ run:04d }}-s000-c000.xtc2"

ConvertXtc1to2:
  nevents: 5
  output_file: "{{ RESULTS_DIR }}/{{ PSDM_SUBDIR }}/{{ XTC2_FILE_NAME }}"
  node_id: "1"
  xtc1_access_pattern:
    epix10k2M:
      - xtc2_attr_name: "calib"
        object_name: "epix10k2M"
        object_type: "psana.Detector"
        object_field_name: "calib"

...
