%YAML 1.3
---
# ========= HEADER (global) =========
title: "SFX: Pipeline for Dr + PeakFinding"
experiment: "mfxx49820"
run: "25"
run_pad: "0025" 
date: "2025/10/15"
lute_version: 0.1
task_timeout: 259200

work_dir: "/sdf/data/lcls/ds/mfx/mfxx49820/results/nclaret/lute_output/Wavelet/dionisio_DWT_peakfinding//wavelet_dionisio/X_hat/r0025/"
...
---
detector: "epix10k2M"                  
out_root:  "{{ work_dir }}"
pv_camera_length: "MFX:ROB:CONT:POS:Z"         
event_receiver: "evr0"    
#TO-DO: Update to use run-specific geom files.
geom_file: "/sdf/data/lcls/ds/mfx/mfxx49820/results/nclaret/geom/r0016.geom"
   


DrFindPeaksPyAlgos:
  outdir: "{{ out_root }}"  
  det_name: "{{ detector }}"                      
  event_receiver: "{{ event_receiver }}"          
  pv_camera_length: "{{ pv_camera_length }}"      

  n_events: 0             
  psana_mask: false
  min_peaks: 10
  max_peaks: 2048
  npix_min: 2
  npix_max: 30
  amax_thr: 40
  atot_thr: 180
  son_min: 10
  peak_rank: 3
  r0: 3.0
  dr: 2.0
  nsigm: 10.0
  tol: 1e-3
  max_iter: 500
  dr_component: "X_hat"
  dr_method: "wavelet_dionisio"
  size: 7
  post_threshold_scale: 0



IndexCrystFEL:
  # This path is now correct because DrFindPeaksPyAlgos.outdir has been updated.
  in_file: "{{ DrFindPeaksPyAlgos.outdir }}/{{ experiment }}_{{ run }}_.list"
  executable: "/sdf/group/lcls/ds/tools/crystfel/0.10.2/bin/indexamajig"
  out_file: "{{ out_root }}/stream_{{ run }}.stream"
  geometry: "{{ geom_file }}"
  no_revalidate: True
  multi: True
  indexing: "mosflm,xds"
  int_radius: '3,4,5'
  profile: True
  peaks: "cxi"
  tolerance: "5,5,5,1.5"
  cell_file: "/sdf/data/lcls/ds/mfx/mfxx49820/results/btx_pypca/cell/reference.cell"


...